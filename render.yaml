services:
  - type: web
    name: ai-tutor-studio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GENERATE_MODEL
        value: gemini-3.5-flash-lite
      - key: SEARCH_MODEL
        value: gemini-3.5-flash-lite
