name: Marketing Tycoon P0 — bootstrap lockfile

on:
  push:
    branches:
      - fix/marketing-tycoon-p0-economy-ci-20261018

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit generated lockfile to feature branch
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock npm dependencies for reproducible CI"
            git push
          fi
      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, regression tests and Vite production build
        run: npm run build
      - name: Verify procedural GLBs are deterministic
        run: npm run assets:verify
