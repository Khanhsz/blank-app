name: Build offline OpenStreetMap food database
on:
  push:
    branches:
      - deploy/tripmate-ai
    paths:
      - '.github/workflows/refresh-food-database.yml'
      - 'scripts/import_food_osm.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-osm:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Check out TripMate
        uses: actions/checkout@v4
        with:
          ref: deploy/tripmate-ai
          persist-credentials: true
      - name: Import authentic OSM city extracts
        run: python3 scripts/import_food_osm.py
      - name: Validate priority-city coverage and source IDs
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/food-venues.json',encoding='utf-8'))
          assert d['schema'] == 2 and d['license'] == 'ODbL-1.0'
          assert len(d['places']) >= 15
          assert any(x['slug'] == 'Saigon' and x['count'] >= 15 for x in d['cities'])
          assert all(p['id'].split('/')[0] in ('node','way') and p['osmUrl'].startswith('https://www.openstreetmap.org/') for p in d['places'])
          saigon = [p for p in d['places'] if p['city']=='Saigon']
          assert sum(bool(p.get('localFood')) for p in saigon) >= 10, 'No source-tagged local food in Saigon'
          assert sum(p['id'].startswith('way/') for p in saigon) >= 5, 'Way geometries not imported'
          print('Verified',len(d['places']),'food POIs, with',sum(bool(p.get('localFood')) for p in d['places']),'local-eats indicators')
          PY
      - name: Commit verified static database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/food-venues.json
          if git diff --cached --quiet; then
            echo "Database snapshot is unchanged"
            exit 0
          fi
          git commit -m "Import real OSM food venues from BBBike [skip ci]"
          git pull --rebase origin deploy/tripmate-ai
          git push origin HEAD:deploy/tripmate-ai
