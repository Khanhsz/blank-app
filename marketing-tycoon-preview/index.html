<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#27221f">
<title>Marketing Tycoon — Start Small. Think Big.</title>
<style>
/* MARKETING TYCOON — FIELD NOTES / INTERFACE v2
   Editorial warmth inspired by modern creative software, with a distinct game identity. */
:root{
 --paper:#faf7f1;--white:#fffdf8;--canvas:#ede5d9;--ink:#27221f;--muted:#84766d;--line:#e9e0d6;
 --orange:#bd694a;--orange-dark:#9d5138;--orange-light:#fae8df;--cream:#f2ece3;
 --green:#50765c;--mint:#e8f0e7;--warn:#ae733c;--navy:#27221f;--teal:#bd694a;--teal-d:#a9593e;
 --shadow:0 22px 80px rgba(52,37,25,.16);--display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
 --sans:'Avenir Next','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}
html{font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
body{color:var(--ink);background:#ece4d7}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.46}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(189,105,74,.38);outline-offset:2px}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.world-shade{pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,rgba(50,29,14,.09),transparent 21%,transparent 73%,rgba(34,29,20,.16)),radial-gradient(ellipse at 50% 55%,transparent 40%,rgba(43,31,22,.07) 100%)}
/* HEADS UP DISPLAY */
.topbar{z-index:10;position:absolute;left:30px;right:30px;top:26px;display:flex;gap:12px;align-items:center;justify-content:space-between;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;gap:12px;align-items:center;min-height:59px;padding:6px 19px 6px 7px;background:rgba(255,252,247,.94);border:1px solid #fff8ed;box-shadow:0 7px 28px rgba(50,35,21,.09);border-radius:15px;backdrop-filter:blur(20px)}
.brandmark{display:grid;place-items:center;width:44px;height:44px;border-radius:11px;background:var(--orange);font:700 26px var(--display);color:#fffefb;letter-spacing:-3px;transform:none}
.brandmark span{color:#fff4d3;font:700 18px var(--sans);margin-left:1px}
.brand strong{display:block;font-size:11px;letter-spacing:1.8px;font-weight:850;color:#29211c}
.brand small{display:block;font-size:9px;letter-spacing:1.85px;color:#9a8273;font-weight:750;margin-top:5px}
.status{display:flex;gap:7px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;align-items:center;gap:8px;background:rgba(255,252,247,.94);border:1px solid rgba(255,255,255,.9);padding:12px 15px;border-radius:11px;box-shadow:0 7px 23px rgba(50,35,21,.09);font-size:11px;font-weight:700;white-space:nowrap}
.stat i{font-style:normal;font-size:16px}.stat b{font-size:13px;letter-spacing:-.25px}.stat small{font-size:8px;font-weight:800;color:#997f6b;letter-spacing:1.5px}
.stat.career{background:#282723;color:#faf8f2;border-color:#282723;letter-spacing:.15px}
.icon-button{border:1px solid #fff9ed;border-radius:11px;background:#fffdf8;color:#41312a;width:47px;height:47px;box-shadow:0 7px 22px #49331b16;font-size:22px}
.icon-button:hover{background:var(--orange-light)}
.quest-panel{position:absolute;top:111px;left:30px;width:301px;min-width:0;max-width:none;padding:23px 24px 21px;background:rgba(255,252,247,.96);border:1px solid #fff8ed;border-radius:16px;box-shadow:var(--shadow);z-index:4;backdrop-filter:blur(18px)}
.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--orange);font-size:9.5px;font-weight:850}
.quest-panel .eyebrow{display:flex;align-items:center;gap:6px}
.quest-panel .eyebrow:before{content:'';width:7px;height:7px;border-radius:50%;background:#77a37a;box-shadow:0 0 0 4px #e5f1e2}
.quest-panel h3{font:normal 28px/1.1 var(--display);margin:16px 0 11px;letter-spacing:-.9px;color:#29221c}
.quest-panel p{color:#7d7066;font-size:12px;line-height:1.73;margin:0 0 22px}
.meter{height:5px;border-radius:6px;background:#e9e1d7;overflow:hidden}.meter>span{display:block;height:100%;background:linear-gradient(90deg,#bd694a,#dc9c67);border-radius:6px;transition:width .4s}
.quest-step{font-size:9px;font-weight:850;color:#a28b79;display:flex;justify-content:space-between;margin:12px 0 18px;letter-spacing:.9px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:10px;padding:13px 17px;min-height:43px;background:var(--orange);color:white;font-size:11px;font-weight:850;letter-spacing:.25px;transition:transform .16s ease,background .16s,border .16s,box-shadow .16s}
.button:hover:not(:disabled){background:var(--orange-dark);transform:translateY(-1px);box-shadow:0 7px 18px #a35d4225}
.button.secondary{color:#8d4b37;background:#f7e5da;border-color:#f4d8c9}.button.secondary:hover{background:#f3d7c5}
.button.ghost{background:#f2ece5;color:#62574e;border-color:#eee2d5}.button.ghost:hover{background:#eae0d6}
.button.danger{background:#f8e8e4;color:#a64e49}.button.full{width:100%}.button.small{min-height:33px;padding:9px 12px;font-size:10px}
.button-row{display:flex;gap:9px;flex-wrap:wrap}
.world-panel{position:absolute;right:30px;top:111px;width:247px;padding:22px 22px 19px;border-radius:16px;background:rgba(255,252,247,.90);border:1px solid rgba(255,249,238,.95);box-shadow:0 16px 48px #553b2b21;z-index:3;backdrop-filter:blur(18px)}
.world-panel h4{font:normal 19px/1.25 var(--display);letter-spacing:-.4px;margin:9px 0 10px}
.world-panel p{font-size:11px;line-height:1.8;color:#7a6b60;margin:0}.world-panel .tile{font-size:9px;font-weight:850;color:var(--orange);letter-spacing:2.1px}
.world-panel .guide{font-size:10px;color:#86796e;margin-top:17px;border-top:1px solid #e9e1d7;padding-top:14px;line-height:1.9}
.scene-hint{position:absolute;bottom:114px;left:50%;transform:translateX(-50%);padding:9px 16px;border:1px solid rgba(255,255,255,.20);border-radius:50px;background:#26211edb;color:#fffbf4;z-index:3;font-size:10px;white-space:nowrap;letter-spacing:.25px;box-shadow:0 9px 25px #221b1730}
.dock{z-index:7;position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#272521ee;box-shadow:0 18px 60px #20191755;display:flex;gap:4px;border:1px solid #62574c;border-radius:18px;padding:7px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;backdrop-filter:blur(18px)}
.dock button{min-width:79px;white-space:nowrap;border:0;background:transparent;border-radius:12px;color:#b9aca0;padding:10px 13px 9px;font-size:10px;font-weight:750;transition:background .2s,color .2s,transform .2s}
.dock button:hover{background:#494139;color:#fff}.dock button.active{background:#f7efe5;color:#733f30;box-shadow:0 3px 12px #1112}.dock .nav-icon{font-size:19px;display:block;margin-bottom:6px;filter:saturate(.7)}
.camera-controls{position:absolute;bottom:30px;right:30px;z-index:4;display:flex;gap:4px;background:#fffaf2;padding:5px;border-radius:12px;border:1px solid white;box-shadow:0 9px 28px #20191730}
.camera-controls button{height:32px;width:32px;background:transparent;border:0;border-radius:8px;color:#5f5149;font-size:17px;font-weight:700}.camera-controls button:hover{background:#f0e4d8}
.toast{position:absolute;left:50%;top:102px;transform:translate(-50%,-12px);padding:12px 19px;background:#29231f;color:#fff9ee;font-size:11px;font-weight:750;border:1px solid #ffffff21;border-radius:12px;z-index:30;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 11px 30px #201b1855}.toast.active{opacity:1;transform:translate(-50%,0)}
/* MODAL + WORKSTATION */
#modalRoot:empty{display:none}.scrim{z-index:15;position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:stretch;background:rgba(38,32,28,.48);backdrop-filter:blur(6px) saturate(.65);animation:fadein .25s}.scrim.centered{align-items:center;justify-content:center;padding:22px}
.modal{background:var(--paper);width:min(672px,100vw);height:100%;overflow-y:auto;overflow-x:hidden;box-shadow:-25px 0 85px #2b221d49;animation:slidein .28s cubic-bezier(.22,1,.36,1);scrollbar-color:#d9c8b8 transparent;scrollbar-width:thin}
.modal.wide{width:min(850px,100vw)}.modal.onboarding{height:auto;max-height:min(830px,calc(100vh - 44px));width:min(1070px,calc(100vw - 40px));border:1px solid rgba(255,248,240,.75);border-radius:21px;box-shadow:0 35px 110px #2b201f70;animation:appear .35s cubic-bezier(.2,1,.4,1)}
.modalhead{position:sticky;top:0;z-index:5;background:rgba(250,247,241,.96);backdrop-filter:blur(16px);display:flex;justify-content:space-between;gap:16px;align-items:center;padding:27px 37px 22px;border-bottom:1px solid var(--line)}
.modalhead h2{font:normal 31px/1.12 var(--display);margin:8px 0 0;letter-spacing:-1px}.modalhead .eyebrow{font-size:9px}
.close{width:39px;height:39px;display:grid;place-items:center;border:1px solid #e9ddd2;border-radius:10px;background:#fffbf5;font-size:22px;color:#716057}.close:hover{background:#f6e7dc}
.modalbody{padding:29px 37px 55px}.intro{background:#f1e7d9;padding:23px 26px;border-radius:15px;border:1px solid #e8dccc;margin-bottom:25px;position:relative;overflow:hidden}
.intro:after{content:'✳';position:absolute;right:12px;top:-34px;font:normal 145px var(--display);color:#e6c8b0;opacity:.47;pointer-events:none}
.intro>*{position:relative;z-index:1}.intro .client-icon{font-size:27px;display:inline-grid;place-items:center;width:48px;height:48px;background:#fffbf5;border:1px solid #e8d7c6;border-radius:12px;margin-bottom:11px}
.intro h3{font:normal 28px/1.18 var(--display);margin:10px 0;letter-spacing:-.75px;max-width:90%}.intro p{font-size:12px;line-height:1.8;color:#75685e;margin:0;max-width:540px}
.section-title{font-size:12px;font-weight:850;letter-spacing:.1px;margin:25px 0 12px}.muted{color:#82776d}.small-text{font-size:11px;line-height:1.8}.fine{font-size:10px;color:#998779;line-height:1.75}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:12px}.row{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;gap:5px;align-items:center;background:#eaf0e7;color:#4d7357;font-size:10px;font-weight:850;padding:8px 11px;border-radius:50px}.pill.amber{background:#f8e9d3;color:#9b672c}.pill.red{background:#fbe7e2;color:#ac574b}
.line{height:1px;background:var(--line);margin:22px 0}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.choice{border:1px solid #e5d9ce;background:#fffdfa;padding:20px;text-align:left;border-radius:12px;transition:all .18s;color:#332b25;min-height:93px;position:relative;box-shadow:0 3px 12px #51362305}
.choice:hover{border-color:#ce947b;transform:translateY(-2px);box-shadow:0 10px 24px #76534015}.choice.selected{background:#f9ede6;border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange),0 6px 18px #aa66431a}
.choice.selected:after{content:'✓';position:absolute;right:11px;top:11px;font-size:10px;border-radius:50%;width:19px;height:19px;display:grid;place-items:center;background:var(--orange);color:#fff}
.choice b{font-size:12px;display:block;margin-bottom:7px;line-height:1.45}.choice span,.choice small{font-size:11px;color:#84776c;line-height:1.65;display:block}.choice .icon{font-size:22px;display:block;margin-bottom:12px}.choice .price{color:#9e6341;font-weight:800}
.research-item{display:flex;gap:14px;border:1px solid #e9dfd6;border-radius:12px;padding:17px;margin-bottom:10px;background:#fffdfa;align-items:center;transition:border .15s}
.research-item:hover{border-color:#d6b6a2}.research-item .symbol{display:grid;place-items:center;border-radius:12px;background:#f3e6da;width:48px;height:48px;font-size:21px;flex-shrink:0}
.research-item .details{flex:1;min-width:0}.research-item b{font-size:12px}.research-item p{font-size:11px;color:#81776d;line-height:1.65;margin:5px 0}
.result-box{padding:19px 21px;background:#f1eee6;border:1px solid #e4ded2;border-radius:12px;margin:14px 0}.result-box b{font-size:12px}.result-box p{font-size:11px;color:#665d54;line-height:1.8;margin:7px 0 0}
.label{display:block;font-size:10px;font-weight:850;margin:17px 0 8px;color:#67574c;letter-spacing:.4px}.field,select{width:100%;padding:13px 14px;min-height:45px;border:1px solid #ded0c3;background:#fffdf9;color:#42372e;border-radius:9px;outline:none;font-size:12px;transition:border .16s,box-shadow .16s}
.field:focus,select:focus{border-color:#bd694a;box-shadow:0 0 0 3px #bd694a1c}.fieldgroup{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.output-preview{display:grid;grid-template-columns:106px 1fr;gap:18px;align-items:center;background:#302822;color:#fffbf4;padding:21px;border-radius:13px;margin:18px 0}.output-preview .emblem{display:grid;place-items:center;border-radius:10px;background:linear-gradient(150deg,#dfaa76,#bd6346);height:94px;font-size:34px}.output-preview small{display:block;font-size:10px;color:#d6bdac}.output-preview h3{margin:7px 0;font:normal 23px var(--display)}.output-preview p{font-size:11px;color:#dccdc1;line-height:1.7}
.barline{display:flex;align-items:center;gap:12px;margin:17px 0}.barline>span{font-size:11px;font-weight:800;min-width:104px}.barline input{flex:1;accent-color:#bd694a}.barline>b{min-width:73px;text-align:right;font-size:11px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:17px 0}.kpi{background:#fffdfa;border:1px solid #e8ded4;border-radius:12px;padding:19px 17px}.kpi small{font-size:10px;color:#988777}.kpi b{display:block;font:normal 33px/1 var(--display);letter-spacing:-1px;margin:13px 0 10px}.kpi span{font-size:10px;color:#84776a}
.timeline{display:flex;gap:5px;overflow-x:auto;margin:0 0 27px;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:#e1d3c7 transparent}
.timeline span{min-width:65px;flex:1;padding:9px 6px;text-align:center;font-size:9px;letter-spacing:.15px;font-weight:850;border:1px solid #e9ddd1;background:#f2eae2;color:#a09286;border-radius:6px}
.timeline span.done{background:#e3ebe2;color:#4f7853;border-color:#d5e3d1}.timeline span.current{background:#bd694a;color:#fff;border-color:#bd694a;box-shadow:0 5px 13px #a8593a20}
.brief-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.brief-metrics div{padding:17px 14px;background:#fffdfa;border:1px solid #e9e0d7;border-radius:11px}.brief-metrics small{font-size:9px;color:#988778;display:block}.brief-metrics b{font:normal 19px var(--display);margin-top:10px;display:block}
.log-entry{border-left:2px solid #cb9477;padding:5px 0 5px 15px;margin:12px 0;font-size:11px;line-height:1.75;color:#81746b}.log-entry b{color:#51443b}
.mini-note{padding:14px 15px;font-size:11px;border-radius:10px;color:#627861;background:#e8eee5;margin-bottom:17px}.client-chat{border-radius:14px;padding:18px;background:#ece3d9;margin:16px 0}.bubble{background:#fffdfa;border-radius:12px 12px 12px 3px;padding:14px 17px;font-size:12px;line-height:1.75;margin:9px 0 0;color:#645950;max-width:95%;box-shadow:0 4px 15px #2c1f160a}.client-chat .meta{font-size:9px;color:#8c7462;font-weight:850;letter-spacing:1.2px}
.case-card{padding:19px;border:1px solid #e7dbd0;background:#fffdfa;border-radius:11px;margin:9px 0}.case-card h4{font-size:13px;margin:0 0 7px}.case-card p{font-size:11px;line-height:1.7;color:#817266;margin:0 0 11px}.case-card footer{display:flex;gap:13px;font-size:10px;font-weight:800;color:#a16f53}
.agency-banner{background:linear-gradient(115deg,#312a26,#71513e);color:#fff;padding:26px;border-radius:13px;margin:16px 0}.agency-banner h3{font:normal 29px var(--display);margin:8px 0}.agency-banner p{color:#e3d1c3;font-size:11px;line-height:1.8}
.note-bubble{background:#faf0e0;border:1px solid #ead9c4;color:#86613e;border-radius:10px;padding:14px 16px;margin:17px 0;font-size:11px;line-height:1.8}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.staff-name{display:flex;gap:10px;align-items:center}.avatar-emoji{display:grid;place-items:center;width:43px;height:43px;background:#f3e5d9;border-radius:10px;font-size:24px}.hline{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:11px 0}.hline span{font-size:11px;color:#837569}.hline b{font-size:12px}.footer-credit{font-size:10px;color:#a3968b;margin-top:24px}.divider-title{font-size:10px;font-weight:850;letter-spacing:1.8px;color:#ad7358;margin-bottom:16px}
/* CHARACTER CREATOR / COVER */
.onboard-layout{display:grid;grid-template-columns:.92fr 1.08fr;min-height:620px}
.onboard-visual{background:#d9a487;position:relative;overflow:hidden;min-height:620px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}
.onboard-visual:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 53% 40%,#f8cead 0,#eeb998 34%,#cb8d75 76%,#b87764);z-index:-1}
.onboard-visual:after{content:'';position:absolute;inset:0;opacity:.11;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E");pointer-events:none}
.visual-top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:30px 30px 0;color:#583a32}
.visual-top b{font-size:10px;letter-spacing:2.1px}.visual-top span{border:1px solid #69432b50;background:#fff4e933;border-radius:30px;padding:8px 13px;font-size:10px;font-weight:800}
.cover-illustration{position:relative;z-index:2;width:114%;max-height:425px;align-self:center;margin:6px -5% 0;filter:drop-shadow(0 25px 17px #5f312735)}
.cover-big-number{font:normal 170px/1 var(--display);position:absolute;top:63px;left:20px;letter-spacing:-14px;color:#fff1de40;z-index:1;pointer-events:none}
.visual-footer{z-index:3;position:relative;display:flex;justify-content:space-between;align-items:end;gap:20px;color:#5b382c;padding:0 31px 31px}
.visual-footer h3{font:normal 32px/1.12 var(--display);margin:0;letter-spacing:-1.1px}.visual-footer small{display:block;font-size:9px;line-height:1.7;max-width:115px;text-align:right;font-weight:750;letter-spacing:1.2px}
.onboard-content{padding:47px 43px 34px;background:#faf7f1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.onboard-content .eyebrow{font-size:10px}.onboard-content h1{font:normal 49px/1.04 var(--display);letter-spacing:-2.6px;margin:15px 0 17px;color:#2a2420}
.onboard-content h1 em{color:var(--orange);font-weight:normal;font-style:italic}
.onboard-content p{font-size:12px;color:#817269;line-height:1.85;margin:0 0 15px;max-width:455px}
.onboard-content .fieldgroup{gap:12px}.onboard-content .label{margin-top:14px}.character-options{display:flex;gap:9px;margin:9px 0;flex-wrap:wrap}
.swatch{height:33px;width:33px;border-radius:50%;border:3px solid #faf7f1;outline:1px solid #d4c5b6;display:inline-grid;place-items:center;transition:transform .15s}
.swatch:hover{transform:scale(1.12)}.swatch.selected{outline:2px solid var(--orange);outline-offset:2px}
.hair-btn{border:1px solid #e0d2c5;padding:9px 13px;background:#fffdfa;border-radius:8px;font-size:11px;color:#6e5d52}
.hair-btn:hover{border-color:#c38b71}.hair-btn.selected{background:#f4e0d4;border-color:#bd694a;color:#854e39}
.footer-actions{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:26px}.footer-actions .fine{max-width:155px}.onboard-content .footer-actions .button{min-width:210px;min-height:48px}
/* Extended small utility decorations */
.chapter-rule{margin:16px 0 4px;height:1px;background:linear-gradient(90deg,#d8b4a0,transparent)}

function surveyQuality(){let c=state.campaign;if(!c.survey)return 0;return clamp((c.survey.sample===120?.35:c.survey.sample===60?.25:.08)+(c.survey.audience===current().trueSegment?.43:c.survey.audience==='everyone'?.07:.15)+(c.survey.question==='barrier'?.2:.04)+(state.upgrades.includes('research')?.1:0),.1,1)}
function surveyResults(){const c=state.campaign,s=current(),sur=c.survey;const quality=surveyQuality(),base= Math.round(30+quality*42+hash(c.scenarioIndex*9+sur.sample)*9);return {primary:clamp(base,22,82),other:clamp(Math.round((100-base)*.58),8,58),sample:sur.sample,quality:Math.round(quality*100),reason:insights.find(x=>x.id===s.trueInsight)?.title}}
function renderSurvey(){const c=state.campaign,s=current();if(c.survey){const r=surveyResults();return `${timeline()}<div class="intro"><div class="eyebrow">FIELD RESEARCH · DAY ${c.day}</div><h3>Kết quả khảo sát (${r.sample} phản hồi)</h3><p>Dữ liệu là mô phỏng và có nhiễu mẫu. Không phải tỷ lệ thị trường thật.</p></div><div class="result-box"><b>Phát hiện nổi bật</b><p>${r.primary}% phản hồi liên quan đến “${esc(r.reason)}”. Khoảng ${r.other}% nhắc đến yếu tố thứ cấp khác. Mức tin cậy phương pháp: ${r.quality}/100.</p></div><div class="kpi-grid"><div class="kpi"><small>Cỡ mẫu</small><b>${r.sample}</b><span>người tham gia</span></div><div class="kpi"><small>Tín hiệu chính</small><b>${r.primary}%</b><span>không phải sự thật tuyệt đối</span></div><div class="kpi"><small>Chất lượng mẫu</small><b>${r.quality}</b><span>/ 100</span></div></div><div class="note-bubble">Nếu bạn khảo sát sai tệp hoặc hỏi thiên lệch, một tỷ lệ cao vẫn chưa chắc phản ánh đúng thị trường mục tiêu.</div><button class="button full" data-action="to-validation">DIỄN GIẢI & VALIDATE INSIGHT →</button>`}
return `${timeline()}<div class="intro"><div class="eyebrow">SURVEY DESIGN · DAY ${c.day}</div><h3>Một khảo sát tốt không chỉ cần nhiều người.</h3><p>Chọn đúng tệp, cỡ mẫu và câu hỏi có thể quyết định insight tiếp theo.</p></div><div class="section-title">1. Ai sẽ trả lời khảo sát?</div><div class="choice-grid">${segments.map(v=>`<button class="choice ${localSurvey.audience===v.id?'selected':''}" data-action="aud-${v.id}"><b>${v.title}</b><span>${v.id==='everyone'?'Rộng nhưng khó đại diện mục tiêu cụ thể':'Khảo sát nhóm đối tượng được chọn'}</span></button>`).join('')}</div><div class="section-title">2. Quy mô mẫu</div><div class="choice-grid">${[20,60,120].map(v=>`<button class="choice ${localSurvey.sample===v?'selected':''}" data-action="sample-${v}"><b>${v} phản hồi</b><span class="price">${money(surveyCosts[v])}</span></button>`).join('')}</div><div class="section-title">3. Cách đặt câu hỏi</div><div class="choice-grid"><button class="choice ${localSurvey.question==='barrier'?'selected':''}" data-action="question-barrier"><b>“Điều gì khiến bạn chưa thử?”</b><span>Hỏi mở về trở ngại và hành vi thực.</span></button><button class="choice ${localSurvey.question==='leading'?'selected':''}" data-action="question-leading"><b>“Bạn thích ưu đãi của chúng tôi chứ?”</b><span>Câu hỏi dẫn dắt, dễ tạo sai lệch.</span></button></div><div class="note-bubble">Chi phí: ${money(surveyCosts[localSurvey.sample])} · Ngân sách còn ${money(s.budget-c.spent)}</div><button class="button full" data-action="run-survey" ${!canPay(surveyCosts[localSurvey.sample])?'disabled':''}>THỰC HIỆN KHẢO SÁT →</button>`}

function renderStrategy(){const c=state.campaign;localStrategy=localStrategy||structuredClone(c.strategy);return `${timeline()}<div class="intro"><div class="eyebrow">STRATEGIC PLANNING</div><h3>Marketing là lựa chọn, không phải làm tất cả.</h3><p>Xác định phân khúc, mục tiêu kinh doanh và lời hứa của thương hiệu. Chúng có thể hỗ trợ hoặc triệt tiêu lẫn nhau.</p></div><div class="section-title">Target audience</div><div class="choice-grid">${segments.map(x=>`<button class="choice ${localStrategy.segment===x.id?'selected':''}" data-action="seg-${x.id}"><b>${x.title}</b></button>`).join('')}</div><div class="section-title">Campaign objective</div><div class="choice-grid">${objectives.map(x=>`<button class="choice ${localStrategy.objective===x.id?'selected':''}" data-action="obj-${x.id}"><b>${x.title}</b></button>`).join('')}</div><div class="section-title">Brand positioning</div><div class="choice-grid">${positions.map(x=>`<button class="choice ${localStrategy.position===x.id?'selected':''}" data-action="pos-${x.id}"><b>${x.title}</b></button>`).join('')}</div><div class="note-bubble">Người chơi có thể chọn một objective “đẹp” như reach, nhưng khách hàng đang quan tâm tới kết quả kinh doanh.</div><button class="button full" data-action="confirm-strategy">PHÊ DUYỆT CHIẾN LƯỢC →</button>`}
function renderCreative(){const c=state.campaign;return `${timeline()}<div class="intro"><div class="eyebrow">CREATIVE STUDIO</div><h3>Biến insight thành ý tưởng.</h3><p>Không phải creative đắt nhất là creative hiệu quả nhất. Mức phù hợp với chiến lược có thể quan trọng hơn chi phí.</p></div><div class="choice-grid">${creatives.map(k=>`<button class="choice ${localCreative===k.id?'selected':''}" data-action="creative-${k.id}"><span class="icon">${k.icon}</span><b>${k.title}</b><small>${k.subtitle}</small><span style="margin-top:7px">${k.desc}</span><span class="price" style="margin-top:9px">${money(k.cost)}</span></button>`).join('')}</div>${localCreative?`<div class="output-preview"><div class="emblem">${creatives.find(x=>x.id===localCreative)?.icon}</div><div><small>CAMPAIGN CONCEPT PREVIEW</small><h3>${creatives.find(x=>x.id===localCreative)?.title}</h3><p>Concept sẽ được triển khai trên các kênh đã chọn ở bước tiếp theo.</p></div></div>`:''}<div class="note-bubble">Ngân sách còn lại trước sản xuất: ${money(current().budget-c.spent)}</div><button class="button full" data-action="confirm-creative" ${!localCreative||!canPay(creatives.find(x=>x.id===localCreative)?.cost||0)?'disabled':''}>SẢN XUẤT & ĐẾN MEDIA PLAN →</button>`}
function mediaTotal(){return Object.values(localMedia||state.campaign.media).reduce((a,b)=>a+Number(b||0),0)}
function renderMedia(){const c=state.campaign;localMedia=localMedia||structuredClone(c.media);let remaining=current().budget-c.spent,alloc=mediaTotal();return `${timeline()}<div class="intro"><div class="eyebrow">MEDIA BUDGET LAB</div><h3>Tiêu tiền có chủ đích.</h3><p>Phân bổ tiền giữa bốn kênh. Mỗi kênh có hiệu suất khác nhau tùy ngành hàng và tệp mục tiêu.</p></div><div class="kpi-grid"><div class="kpi"><small>Ngân sách campaign</small><b>${compact(current().budget)}</b></div><div class="kpi"><small>Research + creative</small><b>${compact(c.spent)}</b></div><div class="kpi"><small>Còn phân bổ</small><b>${compact(remaining)}</b></div></div>${mediaChannels.map(m=>`<div class="barline"><span>${m.icon} ${m.title}</span><input type="range" data-media="${m.id}" min="0" max="${Math.floor(remaining/100000)*100000}" step="100000" value="${localMedia[m.id]||0}"><b data-media-value="${m.id}">${compact(localMedia[m.id]||0)}</b></div><div class="fine" style="margin:-8px 0 11px 123px">${m.description}</div>`).join('')}<div class="result-box"><div class="hline"><span>Tổng media budget</span><b id="mediaAllocated">${money(alloc)}</b></div><div class="hline"><span>Dự phòng chưa sử dụng</span><b id="mediaReserve">${money(remaining-alloc)}</b></div><div id="mediaWarning" class="small-text" style="color:${alloc>remaining?'#c45b49':'#689386'}">${alloc>remaining?'Vượt ngân sách!':'Có thể giữ lại tiền để tối ưu giữa campaign.'}</div></div><button class="button full" data-action="launch" ${alloc<500000||alloc>remaining?'disabled':''}>🚀 LAUNCH CAMPAIGN →</button>`}
function scoreModel(mode='final'){
 const c=state.campaign,s=current(),fit={insight:c.insight===s.trueInsight?1:0,segment:c.strategy.segment===s.trueSegment?1:0,position:c.strategy.position===s.truePosition?1:0,objective:c.strategy.objective===s.trueObjective?1:0,creative:c.creative===s.trueCreative?1:0};
 let research=c.research.reduce((a,id)=>a+(researchOptions.find(x=>x.id===id)?.quality||0),0);
 let qual=(.46+.055*Math.min(3,research)+.11*surveyQuality()+.12*fit.insight+.11*fit.segment+.08*fit.position+.085*fit.objective+.11*fit.creative-Math.max(0,c.day-7)*.012);
 if(state.agencyUnlocked){for(const [task,job] of Object.entries(c.jobs||{})){if(job.status!=='approved'||!state.staff.includes(job.employee))continue;qual+=job.employee===workstreams[task].role?.035:-.015;if(job.applied)qual+=.01}}
 if(state.upgrades.includes('creative'))qual+=.025;
 let effSpend=Object.entries(c.media).reduce((t,[k,v])=>t+v*(s.channel[k]||.7),0);
 if(state.upgrades.includes('influencer'))effSpend+=c.media.creator*.05;
 if(state.upgrades.includes('media'))effSpend+=c.media.paid*.045;
 if(mode==='interim')effSpend*=.49;
 let optBonus=mode==='final'?({refresh:fit.creative?3:5,retarget:c.media.paid>0?6:0,promo:c.media.promo>0?3:1,hold:0}[c.optimization]||0):0;
 let seed=hash(c.scenarioIndex*13+(c.survey?.sample||0)+c.research.length*7)*5-2.5;
 const pct=Math.round(clamp((effSpend/1e6)*5.6*qual-(mode==='final'?9:6)+optBonus+seed,-12,85));
 const outcome=Math.round(s.baseline*(1+pct/100));
 const adReach=Math.round((Object.values(c.media).reduce((a,b)=>a+b,0)/1000)*11.2*qual*(mode==='interim'?.51:1));
 return {pct,outcome,adReach,quality:Math.round(qual*100),fit,performance:pct>=s.target?'target':pct>=s.target*.7?'near':'under'};
}
function renderLive(){const c=state.campaign,s=current(),m=c.liveMetrics||scoreModel('interim'),r=s.budget-c.spent;
return `${timeline()}<div class="intro"><div class="eyebrow">CAMPAIGN LIVE · DAY ${Math.max(c.day,7)}/${s.days}</div><h3>Vẫn còn thời gian để thay đổi.</h3><p>Đây là dữ liệu giữa kỳ, chưa phải toàn bộ kết quả. Bạn có thể điều chỉnh nhưng mọi lựa chọn đều có chi phí cơ hội.</p></div><div class="kpi-grid"><div class="kpi"><small>Ước tính reach</small><b>${compact(m.adReach)}</b><span>tiếp cận mô phỏng</span></div><div class="kpi"><small>Biến động KPI</small><b>${m.pct>0?'+':''}${m.pct}%</b><span>so với baseline giữa kỳ</span></div><div class="kpi"><small>Ngân sách dự phòng</small><b>${compact(r)}</b><span>chưa sử dụng</span></div></div><div class="section-title">Quyết định giữa chiến dịch</div><div class="choice-grid">${[{id:'refresh',title:'Thay creative',price:Math.min(r,400000),desc:'Nâng độ mới của thông điệp; mất công sản xuất.'},{id:'retarget',title:'Retarget đúng tệp',price:Math.min(r,550000),desc:'Tập trung vào những người từng tương tác.'},{id:'promo',title:'Kích hoạt ưu đãi',price:Math.min(r,300000),desc:'Tăng nhu cầu ngắn hạn nhưng có rủi ro lệch định vị.'},{id:'hold',title:'Giữ nguyên phương án',price:0,desc:'Không tốn thêm ngân sách, chấp nhận tín hiệu hiện tại.'}].map(o=>`<button class="choice" data-action="opt-${o.id}"><b>${o.title}</b><span>${o.desc}</span><span class="price" style="margin-top:8px">${o.price?`+ ${money(o.price)}`:'0đ'}</span></button>`).join('')}</div><div class="note-bubble">Không có quyết định nào đảm bảo thành công. Sự phù hợp chiến lược và thông tin ban đầu vẫn chi phối kết quả.</div>`}

j.applied?'Đã duyệt & áp dụng':'Đã duyệt'):'Chưa duyệt'}</b></div>`).join(''):'<div class="fine">Không có nhân viên nào được giao task trong dự án.</div>'}`:''}<div class="section-title">Điểm chiến dịch & ảnh hưởng dài hạn</div><div class="hline"><span>Performance score</span><b>${r.qualityScore}/100</b></div><div class="hline"><span>Uy tín nhận được</span><b>+${r.rep} REP</b></div><div class="hline"><span>Chuyên môn tích lũy</span><b>+${r.xp} XP</b></div><div class="note-bubble">Insight thực tế mô phỏng: <b>${insights.find(x=>x.id===s.trueInsight)?.title}</b>. ${c.insight===s.trueInsight?'Bạn đã xác định đúng vấn đề.':'Bạn đã chọn giả thuyết khác, dẫn đến một phần ngân sách kém phù hợp.'} ${c.strategy.objective===s.trueObjective?'Objective sát brief.':'Objective chưa trùng với KPI mà khách quan tâm.'}</div><div class="button-row"><button class="button" data-action="next-client">NHẬN CAMPAIGN TIẾP THEO →</button>${state.cityUnlocked?'<button class="button secondary" data-action="go-city">KHÁM PHÁ THÀNH PHỐ 🏙️</button>':''}</div><div class="footer-credit">Mọi dữ liệu khách hàng, kết quả và phản hồi trong game đều là dữ liệu giả lập phục vụ học tập.</div>`}

function renderDistrict(id){const data={research:{emoji:'🔎',title:'Research Lab',summary:'Nghiên cứu có chất lượng cải thiện ước lượng, không đảm bảo thắng.'},creative:{emoji:'🎨',title:'Creative Studio',summary:'Hợp tác với production network, thêm năng lực triển khai.'},media:{emoji:'📊',title:'Media Hub',summary:'Nâng khả năng phân tích và điều chỉnh paid media.'},influencer:{emoji:'🎥',title:'Influencer District',summary:'Tìm creator có tệp người theo dõi phù hợp chiến dịch.'},network:{emoji:'🤝',title:'Networking Café',summary:'Tạo quan hệ và nhận thêm brief để xây dựng portfolio.'},brand:{emoji:'🏙️',title:'Brand Headquarters',summary:'Các thương hiệu lớn tìm đối tác có kinh nghiệm đáng tin.'},cowork:{emoji:'🪑',title:'Coworking Space',summary:'Không gian làm việc chung và cộng tác viên độc lập.'},agency:{emoji:'🏢',title:'Agency Property',summary:'Thành lập agency của riêng bạn khi đủ điều kiện.'}}[id];if(!data)return '';

 if(id==='network')return `<div class="intro"><div class="client-icon">${data.emoji}</div><div class="eyebrow">NETWORKING EVENT</div><h3>${data.title}</h3><p>${data.summary}</p></div><div class="case-card"><h4>☕ Portfolio review</h4><p>Gặp các chủ doanh nghiệp địa phương. Một hồ sơ thực chiến đáng tin có thể giúp bạn nhận dự án tiếp theo.</p></div><div class="hline"><span>Campaigns completed</span><b>${state.history.length}</b></div><div class="hline"><span>Reputation</span><b>${state.reputation} REP</b></div><button class="button full" data-action="next-client" ${state.campaign.phase!=='results'?'disabled':''}>XIN GIỚI THIỆU KHÁCH HÀNG MỚI →</button>`;
 if(id==='brand')return `<div class="intro"><div class="client-icon">${data.emoji}</div><div class="eyebrow">CLIENT PIPELINE</div><h3>${data.title}</h3><p>${data.summary}</p></div><div class="case-card"><h4>${state.reputation>=25?'✅ Bạn đã có thể nhận brief từ thương hiệu lớn hơn':'🔒 Cần tối thiểu 25 danh tiếng'}</h4><p>Dự án cần chất lượng công việc, cơ sở dữ liệu và trách nhiệm giải trình cao hơn. Làm campaign để mở cơ hội.</p></div><button class="button full" data-action="next-client" ${state.reputation<25||state.campaign.phase!=='results'?'disabled':''}>NHẬN BRIEF MỚI →</button>`;
 if(id==='cowork')return `<div class="intro"><div class="client-icon">${data.emoji}</div><div class="eyebrow">INTERMEDIATE CAREER</div><h3>${data.title}</h3><p>${data.summary}</p></div><div class="result-box"><b>Coworking membership · ${money(300000)}</b><p>Mua thẻ coworking một lần, thêm kinh nghiệm cộng tác và mở một số dịch vụ thành phố.</p></div><button class="button full" data-action="buy-cowork" ${state.upgrades.includes('cowork')||playerMoney()<300000?'disabled':''}>${state.upgrades.includes('cowork')?'✓ ĐÃ ĐĂNG KÝ':'THAM GIA COWORKING'}</button>`;
 if(id==='agency')return renderAgency();return ''}
// Agency operations: a selected employee alone produces no effect. Work must be assigned, delivered and approved.
const workstreams={
 research:{label:'Consumer Research',short:'Research',min:'research',duration:2,role:'researcher',icon:'◈',deliverable:'Research memo'},
 strategy:{label:'Strategic Planning',short:'Strategy',min:'strategy',duration:2,role:'planner',icon:'✦',deliverable:'Strategy recommendation'},
 creative:{label:'Creative Production',short:'Creative',min:'creative',duration:3,role:'creator',icon:'✳',deliverable:'Creative concept'},
 media:{label:'Media Planning',short:'Media',min:'media',duration:2,role:'buyer',icon:'◎',deliverable:'Media mix proposal'}
};
const employeeById=id=>employees.find(e=>e.id===id);
const activeJobs=()=>Object.values(state.campaign.jobs||{}).filter(j=>j.status==='working');
const proposedJob=k=>(state.campaign.jobs||{})[k];
const agencyTaskAllowed=key=>state.agencyUnlocked && state.campaign.phase!=='results' && phaseProgress()>=( {research:1,strategy:4,creative:5,media:6}[key]??99);
function jobReport(key,member,revision){
 const c=state.campaign,s=current(),matching=member.id===workstreams[key].role;
 const evidence=c.research.length+(c.survey?1:0)+(c.insight?1:0);
 if(key==='research')return {suggested:'reviews',headline:matching?'Đề xuất kiểm chứng vấn đề khách hàng':'Đề xuất rà soát review tổng quát',detail:`${s.reports.reviews} ${evidence<2?'Lưu ý: dữ liệu hiện có còn thiếu, không nên khẳng định một nguyên nhân duy nhất.':'Kết hợp với dữ liệu đã thu thập để giảm sai lệch.'}`,method:matching?'Rà soát phản hồi → phân nhóm trở ngại → so sánh với audit / phỏng vấn':'Desk scan nhanh; cần founder kiểm chứng lại nguồn'};
 if(key==='strategy'){
  const sound=matching&&evidence>=2&&c.insight===s.trueInsight;
  return {suggested:{segment:sound?s.trueSegment:'everyone',objective:sound?s.trueObjective:'views',position:sound?s.truePosition:'budget'},headline:sound?'Đề xuất dựa trên evidence và consumer insight':'Bản chiến lược sơ bộ — độ tin cậy thấp',detail:sound?'Audience và mục tiêu được lựa chọn theo brief, khảo sát và vấn đề xác định.':'Dữ liệu/insight chưa đủ vững hoặc nhân sự lệch chuyên môn; cần phản biện, không nên phê duyệt máy móc.',method:'Target → Business objective → Positioning'};
 }
 if(key==='creative'){
  const aligned=matching&&c.strategy.position===s.truePosition;
  const choice=aligned?s.trueCreative:(c.strategy.position==='proof'?'story':c.strategy.position==='style'?'creator':c.strategy.position==='study'?'study':'discount');
  return {suggested:choice,headline:aligned?'Concept phù hợp với positioning':'Concept đề xuất cần kiểm chứng',detail:`Ý tưởng: ${creatives.find(x=>x.id===choice)?.title}. ${aligned?'Chuyển lời hứa thương hiệu thành tình huống sử dụng rõ ràng.':'Định vị hiện tại chưa khớp đầy đủ với nhu cầu khách hàng.'}`,method:'Concept route → visual direction → production brief'};
 }
 const budget=Math.max(0,Math.floor((s.budget-c.spent-450000)/100000)*100000);
 let weights=matching?{paid:.46,creator:.31,promo:.14,flyer:.09}:{paid:.20,creator:.14,promo:.56,flyer:.10};
 if(matching&&s.id==='fashion')weights={paid:.37,creator:.43,promo:.12,flyer:.08};
 if(matching&&s.id==='coffee')weights={paid:.36,creator:.38,promo:.16,flyer:.10};
 const paid=Math.floor(budget*weights.paid/100000)*100000,creator=Math.floor(budget*weights.creator/100000)*100000,promo=Math.floor(budget*weights.promo/100000)*100000;
 return {suggested:{paid,creator,promo,flyer:Math.max(0,budget-paid-creator-promo)},headline:matching?'Media mix ưu tiên hiệu quả kinh doanh':'Media mix có nguy cơ lệch đối tượng',detail:`Dự trù ${money(budget)} cho paid/creator/activation. Dành ${money(s.budget-c.spent-budget)} cho tối ưu hoặc phần việc phát sinh.`,method:'Audience/channel fit → media allocation → contingency'};
}
function advanceAgencyDay(){
 const c=state.campaign,jobs=activeJobs();
 if(!jobs.length||c.phase==='results'){toast('Chưa có công việc đang chạy. Hãy giao task trước.');return}
 c.day++;c.staffWorkdays=(c.staffWorkdays||0)+1;
 const workload={};for(const j of jobs)workload[j.employee]=(workload[j.employee]||0)+1;
 const completed=[];
 for(const job of jobs){
  const spec=workstreams[job.task];const matching=job.employee===spec.role;
  job.progress=Number((job.progress+(matching?1.15:.8)/(workload[job.employee]>1?1.45:1)).toFixed(2));
  if(job.progress>=spec.duration){job.progress=spec.duration;job.status='review';job.completedDay=c.day;job.proposal=jobReport(job.task,employeeById(job.employee),job.revisions||0);completed.push(spec.short)}
 }
 log(completed.length?'Team giao deliverable: '+completed.join(', '):'Agency team cập nhật tiến độ ngày '+c.day);
 save();drawUI();toast(completed.length?'✓ Có '+completed.length+' deliverable chờ duyệt':'Team đã làm việc thêm 1 ngày');
}
function startAgencyJob(key){
 const c=state.campaign,spec=workstreams[key],member=c.assignments?.[key];
 if(!spec||!agencyTaskAllowed(key)||!state.staff.includes(member)||c.jobs?.[key]){toast('Chọn nhân viên và mở đúng giai đoạn công việc.');return}
 if(activeJobs().filter(j=>j.employee===member).length>=2){toast('Nhân viên đang quá tải (2 task).');return}
 c.jobs=c.jobs||{};c.jobs[key]={task:key,employee:member,status:'working',progress:0,startedDay:c.day,revisions:0};
 log(employeeById(member).name+' bắt đầu '+spec.label);save();drawUI();toast('◉ '+employeeById(member).name+' đang thực hiện '+spec.short);
}
function reviewAgencyJob(key,decision){
 const c=state.campaign,j=c.jobs?.[key];if(!j||j.status!=='review'||c.phase==='results')return;
 if(decision==='approve'){
  j.status='approved';j.approvedDay=c.day;
  log('Duyệt '+workstreams[key].deliverable+' của '+employeeById(j.employee).name);
  toast('✓ Deliverable đã duyệt — có thể áp dụng trong Workstation');
 }else if(decision==='revise'){
  if(state.agencyCash<150000){toast('Agency không đủ 150.000đ chi phí sửa bài');return}
  state.agencyCash-=150000;j.status='working';j.progress=0;j.revisions=(j.revisions||0)+1;j.proposal=null;
  log('Yêu cầu sửa '+workstreams[key].short+' (150.000đ)');toast('↻ Yêu cầu chỉnh sửa — team làm lại');
 }
 save();drawUI();
}
function applyAgencyDeliverable(key){
 const c=state.campaign,j=c.jobs?.[key];if(!j||j.status!=='approved'||!j.proposal||j.applied)return;
 if(key==='research'&&c.phase==='research'){
  if(!c.research.includes('reviews'))c.research.push('reviews');
 }else if(key==='strategy'&&c.phase==='strategy'){
  localStrategy={...j.proposal.suggested};
 }else if(key==='creative'&&c.phase==='creative'){
  localCreative=j.proposal.suggested;
 }else if(key==='media'&&c.phase==='media'){
  localMedia={...j.proposal.suggested};
 }else{toast('Mở Workstation tại đúng bước để áp dụng đề xuất này.');return}
 j.applied=true;log('Áp dụng đề xuất '+workstreams[key].short+' trong campaign');save();panel='campaign';drawUI();toast('✓ Đề xuất đã được đưa vào campaign');
}
function phaseAgencyKey(){return ({research:'research',strategy:'strategy',creative:'creative',media:'media'})[state.campaign.phase]}
function renderTeamPrompt(){
 if(!state.agencyUnlocked||state.campaign.phase==='results')return '';
 const key=phaseAgencyKey(),j=key&&proposedJob(key);if(!key)return '';
 const approved=j?.status==='approved';
 return `<div class="team-mini"><div><span class="eyebrow">AGENCY · TEAM WORKFLOW</span><b>${approved?`✓ ${esc(employeeById(j.employee)?.name)} đã giao ${workstreams[key].deliverable}`:j?.status==='review'?'Deliverable đang chờ bạn duyệt':j?.status==='working'?'Team đang sản xuất deliverable':'Giao việc thay vì tự làm tất cả'}</b><small>${approved?esc(j.proposal.headline):j?.status==='working'?`${Math.round(j.progress/workstreams[key].duration*100)}% hoàn thành · theo dõi tại Team Operations`:'Nhân viên chỉ có đóng góp khi hoàn thành và được bạn phê duyệt.'}</small></div><div class="team-mini-actions"><button class="button small secondary" data-action="open-agency">TEAM BOARD ↗</button>${approved&&!j.applied?`<button class="button small" data-action="apply-job-${key}">DÙNG ĐỀ XUẤT</button>`:''}</div></div>`;
}

 const phaseIsDone=c.phase==='results';
 return `<div class="ops-head"><div><div class="eyebrow">TEAM OPERATIONS · CAMPAIGN ${c.scenarioIndex+1}</div><h3>Work isn't automatic.</h3><p>Giao việc, chạy ngày làm việc, kiểm duyệt đầu ra rồi đưa vào campaign. Nhân viên được trả lương ngay cả khi chưa có kết quả.</p></div><div class="ops-count"><b>${done}<span>/4</span></b><small>APPROVED</small></div></div><div class="ops-summary"><span>◷ Day <b>${c.day}/${current().days}</b></span><span>◉ Đang làm <b>${running.length}</b></span><span>✓ Đã duyệt <b>${done}</b></span></div><div class="ops-board">${Object.entries(workstreams).map(([key,spec])=>{
 const j=jobs[key],selected=c.assignments?.[key]||'',member=employeeById(j?.employee||selected);
 const approved=j?.status==='approved',review=j?.status==='review',working=j?.status==='working';
 const blocked=!agencyTaskAllowed(key);
 const label=blocked?`Mở ở bước ${spec.short}`:!member?'Chọn nhân sự để giao việc':j?'':'Sẵn sàng giao việc';
 return `<article class="ops-task ${approved?'task-approved':''}"><div class="ops-task-top"><span class="task-number">${spec.icon}</span><div><b>${spec.label}</b><small>${spec.deliverable} · ${spec.duration} ngày công</small></div><span class="ops-state ${approved?'ok':review?'review':working?'work':''}">${approved?'APPROVED':review?'REVIEW':working?'IN PROGRESS':blocked?'LOCKED':'AVAILABLE'}</span></div><div class="ops-select"><select aria-label="Người phụ trách ${spec.label}" data-assignment="${key}" ${j?'disabled':''}><option value="">Founder tự xử lý</option>${state.staff.map(id=>{let p=employeeById(id);return `<option value="${id}" ${selected===id?'selected':''}>${esc(p.name)} · ${p.role}${p.id===spec.role?' ✓':''}</option>`}).join('')}</select>${member?`<span class="skill-tag ${member.id===spec.role?'fit':'risk'}">${member.id===spec.role?'✓ Chuyên môn phù hợp':'! Lệch chuyên môn'}</span>`:''}</div>${j?`<div class="ops-progress"><div class="ops-meter"><span style="width:${Math.round(j.progress/spec.duration*100)}%"></span></div><small>${working?`${Math.round(j.progress/spec.duration*100)}% · bắt đầu ngày ${j.startedDay}`:review?'100% · chờ founder review':`100% · đã duyệt ngày ${j.approvedDay}`}</small></div>`:`<p class="ops-empty">${label}</p>`}${j?.proposal?`<div class="ops-deliverable"><div class="eyebrow">${spec.deliverable.toUpperCase()}</div><b>${esc(j.proposal.headline)}</b><p>${esc(j.proposal.detail)}</p><small>${esc(j.proposal.method)}</small></div>`:''}<div class="ops-buttons">${!j?`<button class="button small" data-action="start-job-${key}" ${blocked||!selected||phaseIsDone?'disabled':''}>GIAO VIỆC ↗</button>`:review?`<button class="button small" data-action="approve-job-${key}">✓ PHÊ DUYỆT</button><button class="button small secondary" data-action="revise-job-${key}" ${state.agencyCash<150000?'disabled':''}>YÊU CẦU SỬA · 150K</button>`:approved?`<button class="button small ${j.applied?'secondary':''}" data-action="apply-job-${key}" ${j.applied||c.phase!==key?'disabled':''}>${j.applied?'✓ ĐÃ ÁP DỤNG':c.phase===key?'DÙNG TRONG CAMPAIGN →':'ĐÃ DUYỆT · ĐẾN ĐÚNG BƯỚC ĐỂ ÁP DỤNG'}</button>`:`<span class="ops-working">◉ Đang thực thi · bấm “Chạy ngày làm việc” để cập nhật</span>`}</div></article>`}).join('')}</div><div class="ops-footer"><div><b>${running.length?'Team đã sẵn sàng triển khai':'Không có task đang chạy'}</b><small>${running.length?'Một ngày tác động tới mọi task đang thực hiện. Multitasking làm tiến độ chậm lại.':'Nhân viên chưa được giao việc sẽ không cải thiện KPI.'}</small></div><button class="button" data-action="advance-team-day" ${!running.length||phaseIsDone?'disabled':''}>CHẠY 1 NGÀY LÀM VIỆC →</button></div>${c.day>current().days?`<div class="note-bubble">Đã trễ so với kế hoạch ${c.day-current().days} ngày. Score bị ảnh hưởng bởi deadline.</div>`:''}`;
}

function shadow(x,z,r=1){
 // Contact shadows are translucent world-space polygons on top of the floor,
 // rather than painted behind the floor where they would disappear.
 for(const [radius,opacity] of [[1.30,'.06'],[.92,'.10']]){
  const pts=[];
  for(let i=0;i<14;i++){const a=i/14*Math.PI*2;pts.push(V(x+Math.cos(a)*r*radius,.065,z+Math.sin(a)*r*.62*radius))}

 }
}

function building(b){shadow(b.x,b.z,4.2);box3(b.x,b.z,b.w,b.d,b.h,b.color);box3(b.x,b.z,b.w+.8,b.d+.75,.29,tint(b.color,.8),b.h);
 box3(b.x,b.z+b.d/2+.075,2.05,.13,2.15,'#446868');box3(b.x,b.z+b.d/2+.15,1.55,.13,1.68,'#8ad4d0');
 for(let yy=2.3;yy<b.h-1;yy+=2.2)for(let xx=-2.6;xx<=2.7;xx+=2.5){box3(b.x+xx,b.z+b.d/2+.11,1.37,.12,1.17,'#bddad6',yy);box3(b.x+xx,b.z-b.d/2-.11,1.37,.12,1.17,'#bddad6',yy)}

function drawCity(time){quad(0,0,66,52,-.25,'#c6d1b6');
 // Roads and road markings.
 patch(0,0,67,4.8,'#a29b8d');patch(-11,0,4.2,53,'#a7a091');patch(11,0,4.2,53,'#a7a091');
 for(let x=-30;x<=30;x+=4)if(Math.abs(x+11)>3&&Math.abs(x-11)>3)patch(x,0,1.6,.12,'#eae4ce');
 for(let z=-25;z<=25;z+=4){patch(-11,z,.12,1.7,'#eae4ce');patch(11,z,.12,1.7,'#eae4ce')}
 // Sidewalks and pocket parks.
 for(const b of structures)patch(b.x,b.z,b.w+2,b.d+2,'#e2d9c9');
 for(let x=-30;x<=30;x+=4.4){if(Math.abs(x+11)>5&&Math.abs(x-11)>5){octaTree(x,-23,.8,'#69a77c');octaTree(x,24,.9,'#6eaf81')}}
 for(let z=-19;z<=21;z+=5.5){octaTree(-30,z,1,'#6ca67d');octaTree(30,z,.95,'#7ab18b')}
 if(state.graphics!=='low')for(let z=-22;z<=23;z+=7){octaTree(-4.8,z,.6,'#7db28a');octaTree(5.2,z,.6,'#7bb08a')}
 for(let i=0;i<structures.length;i++)building(structures[i]);
 // Small surrounding city blocks.
 for(let i=0;i<6;i++){const x=-27+i*10.7,z=i%2===0?-8:7;if(Math.abs(x+21)<6||Math.abs(x-21)<6)continue;box3(x,z,2.4,2.8,1.7+i%3,'#c6d2bd')}
 if(state.graphics!=='low')for(let i=0;i<10;i++){const speed=.00042+(i%3)*.00005;const z=i%2?-.94:.94;const x=((time*speed*48+i*8)%72)-36;box3(x,z,1.05,.55,.37,i%2?'#e9be78':'#f6f1e3');}
 const npcCount=state.graphics==='low'?3:7;
 for(let i=0;i<npcCount;i++){let t=time*.0002+i*1.7,x=-8+(i%3)*7+Math.sin(t)*2.1,z=-18+(i%4)*11+Math.cos(t)*1.1;if(Math.abs(x)>3)continue;addPerson(x,z,{outfit:['#d97a75','#8397b4','#a08a6e'][i%3],skin:'#c59477'},t*5)}
 addPerson(state.avatar.x,state.avatar.z,{},time*.006);
}
function drawOffice(time){quad(0,0,18,14,-.12,'#e4d1b2');
 face([V(-9,0,-7),V(9,0,-7),V(9,6,-7),V(-9,6,-7)],'#e4d4c0',null,1);
 face([V(-9,0,-7),V(-9,0,7),V(-9,6,7),V(-9,6,-7)],'#d1bda6',null,1);

 for(let i=0;i<4;i++){let x=-5.3+i*3.5;box3(x,-2.5,2.0,1.1,.22,'#a9866d',1.15);box3(x,-3,1.1,.10,.75,'#415a61',1.36);box3(x,-2.93,.95,.08,.55,'#69a4a3',1.49);box3(x,-1.0,1,1.0,.2,'#8eaaac',.65);
 if(i<state.staff.length){
  const member=state.staff[i],jobs=activeJobs().filter(j=>j.employee===member),busy=jobs.length>0;
  addPerson(x,-2.1,{outfit:['#8bafa5','#d98b7a','#8191bd','#a989ba'][i]},time*(busy?.011:.002)+i);

   box3(x+.36,-1.60,.14,.22,.05,'#f6ddac',1.03+Math.sin(time*.011+i)*.04);

  marker(x,3.0,-2.4,busy?'◉ '+jobs.map(j=>workstreams[j.task].short.toUpperCase()).join(' + '):'○ '+(employeeById(member)?.role||'STAFF').toUpperCase(),'agency','',true);
 }}
 box3(0,4,5.8,2,.25,'#aa815f',1.07);for(const x of [-2.4,0,2.4])box3(x,4,.6,.8,.16,'#a9bdb3',.48);
 box3(7,-4.7,1.6,1.5,3,'#d7e3d3');octaTree(-7,4,.9,'#73ae86');octaTree(7,4,1,'#75a984');
 box3(-6.8,-6.6,2,.15,1.7,'#f7f4df',3.3);addPerson(state.avatar.x,state.avatar.z,{},time*.005);

function drawFaces(){faces.sort((a,b)=>a.layer-b.layer||(a.layer===0?a.order-b.order:a.depth-b.depth));for(const o of faces){let ps=o.ps;ctx.beginPath();ctx.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)ctx.lineTo(ps[i].x,ps[i].y);ctx.closePath();ctx.fillStyle=o.color;ctx.fill();if(state.graphics!=='low'){ctx.lineWidth=.6;ctx.strokeStyle=o.stroke||'#624c3525';ctx.stroke()}}}
function drawLabels(time){ctx.textAlign='center';for(let label of labels){let active=hover&&hover.action===hits.find(h=>h.name===label.name)?.action;const txt=label.name,fs=label.small?8:state.scene==='city'?9:11;
 ctx.font=`800 ${fs}px 'Avenir Next',system-ui,sans-serif`;let tw=ctx.measureText(txt).width,pad=label.small?7:10,ww=tw+pad*2+21,x=label.x-ww/2,y=label.y-12;
 if(state.scene==='city'&&ww>camera.scale*9)ww=Math.min(ww,136);
 ctx.fillStyle=active?'#934b35':'#fffbf3';ctx.strokeStyle='#8f603b33';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,ww,26,9);ctx.fill();ctx.stroke();ctx.fillStyle=active?'#fff':'#544138';ctx.font=`800 ${fs}px 'Avenir Next',system-ui,sans-serif`;ctx.fillText(`${label.icon} ${txt}`,x+ww/2,y+16);}}
function sky(time){const gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'#ddc5ad');gradient.addColorStop(.44,'#ecdfcd');gradient.addColorStop(1,'#cbd5bb');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
 const sun=ctx.createRadialGradient(W*.77,H*.13,3,W*.77,H*.13,W*.38);sun.addColorStop(0,'#fff3dcaa');sun.addColorStop(1,'#fff3dc00');ctx.fillStyle=sun;ctx.fillRect(0,0,W,H)}
let lastTime=0;
function frame(t){let dt=Math.min(.045,(t-lastTime)/1000||.016);lastTime=t;tick(dt);setCamera();faces=[];labels=[];hits=[];shadows=[];sky(t);
 if(state.scene==='city')drawCity(t);else if(state.scene==='office')drawOffice(t);else drawRoom(t);
 // The renderer now draws contact shadows in scene depth order.
 drawFaces();drawLabels(t);requestAnimationFrame(frame)}
const held=new Set();let walkSound=0;
function tick(dt){if(!state.created||panel)return;let dx=0,dz=0;for(const key of held){if(key==='w'||key==='arrowup')dz-=1;if(key==='s'||key==='arrowdown')dz+=1;if(key==='a'||key==='arrowleft')dx-=1;if(key==='d'||key==='arrowright')dx+=1}if(dx||dz){let len=Math.hypot(dx,dz),v=state.scene==='city'?7:3.5;state.avatar.x+=dx/len*v*dt;state.avatar.z+=dz/len*v*dt;const bound=state.scene==='city'?25:state.scene==='office'?7:5.8;state.avatar.x=clamp(state.avatar.x,-bound,bound);state.avatar.z=clamp(state.avatar.z,-bound,bound);walkSound+=dt;if(walkSound>1.1){save();walkSound=0}}}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowdown','arrowup',' '].includes(k))e.preventDefault();if(k==='q')state.yaw-=.12;if(k==='e')state.yaw+=.12;if(k==='escape')close();held.add(k)});
window.addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>held.clear());
let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,yaw:state.yaw,drag:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(pointer){const dx=e.clientX-pointer.x;if(Math.abs(dx)>4){pointer.drag=true;state.yaw=pointer.yaw+dx*.006;return}}const match=hits.map(h=>({...h,dist:Math.min(Math.hypot(h.x-e.clientX,h.y-e.clientY),Math.hypot(h.bx-e.clientX,h.by-e.clientY))})).sort((a,b)=>a.dist-b.dist)[0];hover=match&&match.dist<match.r+20?match:null;canvas.style.cursor=hover?'pointer':'grab'});
canvas.addEventListener('pointerup',e=>{if(!pointer)return;const drag=pointer.drag;pointer=null;save();if(drag)return;const p=hits.map(h=>({...h,dist:Math.min(Math.hypot(h.x-e.clientX,h.y-e.clientY),Math.hypot(h.bx-e.clientX,h.by-e.clientY))})).sort((a,b)=>a.dist-b.dist)[0];if(p&&p.dist<p.r+24){const a=p.action;if(a.startsWith('district-'))open(a);else if(a==='agency')open('agency');else action(a)}});
canvas.addEventListener('wheel',e=>{e.preventDefault();state.zoom=clamp(state.zoom*(e.deltaY>0?.92:1.08),.55,1.7);save()},{passive:false});
renderUI();requestAnimationFrame(frame);
