(function(){

function load(){try{var v=JSON.parse(localStorage.getItem(STORAGE)||'{}');['saved','collections','members','ratings','prefs','theme'].forEach(function(k){if(v[k]!=null)state[k]=v[k]});}catch(e){}if(!Array.isArray(state.saved))state.saved=[];if(!Array.isArray(state.collections))state.collections=['Reading List'];}

function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]})}
function url(x){return typeof x==='string'&&/^https:\/\//.test(x)?x:'#'}
function domain(x){return labels[x]||x||'General'}
function t(x){return new Date(x||0).toLocaleDateString('vi-VN',{year:'numeric',month:'short',day:'numeric'})}
function byId(id){return state.data.stories.find(function(s){return s.id===id})}
function filtered(items){var q=state.q.trim().toLowerCase();return (items||[]).filter(function(s){return (state.domain==='All'||s.domain===state.domain)&&(!q||[s.title,s.summary,s.domain,s.what,s.why_you,(s.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))})}
function ordered(xs){return xs.slice().sort(function(a,b){return state.sort==='alpha'?a.title.localeCompare(b.title):Date.parse(b.date||0)-Date.parse(a.date||0)})}
function personalizedOrder(xs){return xs.slice().sort(function(a,b){var wa=Number(state.prefs[a.domain]==null?1:state.prefs[a.domain]);var wb=Number(state.prefs[b.domain]==null?1:state.prefs[b.domain]);return (wb-wa)||Date.parse(b.date||0)-Date.parse(a.date||0)})}
function seed(){return state.data.stories.length&&state.data.stories.some(function(x){return x.preview})}
function pill(txt,k){return '<span class="pill '+(k||'')+'">'+esc(txt)+'</span>'}

function storyCard(s){return '<article class="card story">'+storyImage(s,'card')+originalImageLink(s)+'<div class="meta"><span class="domain">'+esc(domain(s.domain).toUpperCase())+'</span>'+pill(s.confidence||'Evidence: Medium','gray')+' <span>'+t(s.date)+'</span></div><h3>'+esc(s.title)+'</h3><p>'+esc(s.summary||s.what)+'</p><div class="card-bottom"><button class="text-link" data-detail="'+esc(s.id)+'">Đọc phân tích & nguồn →</button>'+saveBtn(s.id)+'</div></article>'}

function reportFeatured(s,i){var u=s.sources&&s.sources[0]?s.sources[0]:null;return '<article class="report-feature"><div class="index">'+('0'+(i+1)).slice(-2)+' / '+esc(domain(s.domain).toUpperCase())+'</div><h3>'+esc(s.title)+'</h3><div class="tagline">KEY EVIDENCE</div><p>'+esc(s.summary)+'</p><div class="tagline">IMPLICATION</div><p>'+esc(s.so_what||'Cần theo dõi và xác minh diễn biến tiếp theo.')+'</p><button class="go" data-detail="'+esc(s.id)+'">Read the analysis & evidence →</button>'+(u?'<div class="source-foot">SOURCE: '+esc(u.publisher||'Original reporting')+' · '+t(s.date)+'</div>':'')+'</article>'}

function toggleSaved(id){if(state.saved.includes(id)){state.saved=state.saved.filter(function(x){return x!==id});Object.keys(state.members).forEach(function(c){state.members[c]=state.members[c].filter(function(x){return x!==id})})}else{state.saved.push(id)}persist();render();if(document.getElementById('detail').open)detailRefresh(id)}

function exportFile(){var content=JSON.stringify({version:4.2,exported:new Date().toISOString(),saved:state.saved,collections:state.collections,members:state.members,prefs:state.prefs,ratings:state.ratings},null,2);var blob=new Blob([content],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='intelligence-workspace-personal-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);toast('Đã xuất bản sao dữ liệu cục bộ')}
function isArray(x){return Array.isArray(x)}
function validateStories(data){if(!data||!isArray(data.stories)||data.stories.length>1000)throw Error('JSON feed requires stories array (max 1,000)');var good=data.stories.map(function(x){if(!x||typeof x.id!=='string'||!/^ST-\d{8}-\d{3}$/.test(x.id)||typeof x.title!=='string'||!x.title.trim()||x.title.length>450)throw Error('Invalid Story ID or title');return {id:x.id,title:x.title,domain:labels[x.domain]?x.domain:'Economics & Business',date:x.date||'',summary:String(x.summary||'').slice(0,800),what:String(x.what||'').slice(0,1200),so_what:String(x.so_what||'').slice(0,900),why_you:String(x.why_you||'').slice(0,800),action:String(x.action||'').slice(0,800),confidence:String(x.confidence||'Medium').slice(0,50),event_type:String(x.event_type||'').slice(0,120),preview:!!x.preview,image_url:typeof x.image_url==='string'?x.image_url:'',image_alt:String(x.image_alt||'').slice(0,220),image_credit:String(x.image_credit||'').slice(0,200),image_source_url:String(x.image_source_url||'').slice(0,1200),tags:isArray(x.tags)?x.tags.map(String).slice(0,12):[],sources:isArray(x.sources)?x.sources.slice(0,5).map(function(z){return {publisher:String(z.publisher||'Source').slice(0,100),url:url(z.url)}}):[]}});var ids=new Set(good.map(function(x){return x.id}));if(ids.size!==good.length)throw Error('Duplicate Story IDs');return {stories:good,links:isArray(data.links)?data.links.slice(0,100):[],opportunities:isArray(data.opportunities)?data.opportunities.slice(0,100):[],updated_at:String(data.updated_at||'')}}
function applyImport(obj){if(obj&&isArray(obj.stories)){state.data=validateStories(obj);state.domain='All';state.q='';document.getElementById('search').value='';toast('Đã nhập '+state.data.stories.length+' story vào phiên hiện tại');render();return}if(obj&&obj.version&&isArray(obj.saved)){state.saved=obj.saved.filter(function(x){return typeof x==='string'}).slice(0,1000);state.collections=isArray(obj.collections)?obj.collections.filter(function(x){return typeof x==='string'}).slice(0,80):state.collections;state.members=obj.members||{};state.prefs=obj.prefs||{};state.ratings=obj.ratings||{};persist();toast('Đã khôi phục dữ liệu cá nhân trong trình duyệt');render();return}throw Error('JSON not a supported feed or personal backup')}
document.addEventListener('click',function(ev){var target=ev.target.closest('button');if(!target)return;var d=target.dataset;if(d.view){state.view=d.view;state.q='';document.getElementById('search').value='';state.domain='All';render();window.scrollTo(0,0)}else if(d.go){state.view=d.go;render();window.scrollTo(0,0)}else if(d.detail){detail(d.detail)}else if(d.save){toggleSaved(d.save)}else if(d.collection){state.selectedCollection=d.collection;render()}else if(d.filterDomain){state.domain=d.filterDomain;state.view='trends';render();window.scrollTo(0,0)}else if(d.deleteCollection){if(confirm('Xóa bộ sưu tập '+d.deleteCollection+'? Tin đã lưu vẫn được giữ.')){state.collections=state.collections.filter(function(x){return x!==d.deleteCollection});delete state.members[d.deleteCollection];state.selectedCollection='All';persist();render()}}else if(target.id==='addCollection'){var v=document.getElementById('collectionName').value.trim();if(!v||v.length>40||state.collections.includes(v))return toast('Tên bộ sưu tập không hợp lệ hoặc đã tồn tại');state.collections.push(v);state.members[v]=[];state.selectedCollection=v;persist();render();toast('Đã tạo bộ sưu tập')}else if(target.id==='clearFilters'){state.domain='All';state.sort='latest';state.q='';document.getElementById('search').value='';render()}else if(target.id==='savePrefs'){persist();toast('Đã lưu sở thích trên thiết bị này')}else if(target.id==='resetPrefs'){state.prefs={};persist();render();toast('Đã đặt lại trọng số mặc định')}else if(target.id==='resetAll'){if(confirm('Xóa toàn bộ dữ liệu lưu cục bộ của Intelligence Workspace?')){localStorage.removeItem(STORAGE);state.saved=[];state.collections=['Reading List'];state.members={};state.prefs={};state.ratings={};state.theme='light';render();toast('Đã xóa dữ liệu cục bộ')}}else if(target.id==='exportBtn'){exportFile()}else if(target.id==='printReport'){window.print()}});
document.addEventListener('change',function(ev){var el=ev.target;if(el.id==='domainFilter'){state.domain=el.value;render()}else if(el.id==='sort'){state.sort=el.value;render()}else if(el.dataset.member){var a=state.members[el.dataset.member]||[];if(el.checked&&!a.includes(el.dataset.story))a.push(el.dataset.story);if(!el.checked)a=a.filter(function(x){return x!==el.dataset.story});state.members[el.dataset.member]=a;if(el.checked&&!state.saved.includes(el.dataset.story))state.saved.push(el.dataset.story);persist();toast('Đã cập nhật bộ sưu tập')}else if(el.dataset.pref){var v=Math.min(1.35,Math.max(.75,Number(el.value)));state.prefs[el.dataset.pref]=v;persist();var idx=Object.keys(labels).indexOf(el.dataset.pref),out=document.getElementById('out-'+idx);if(out)out.textContent=v.toFixed(2)+'×'}});
document.getElementById('search').addEventListener('input',function(e){state.q=e.target.value;render()});
document.getElementById('mode').addEventListener('click',function(){state.theme=state.theme==='light'?'dark':'light';persist();render()});
document.getElementById('importBtn').addEventListener('click',function(){document.getElementById('file').click()});
document.getElementById('file').addEventListener('change',function(ev){var f=ev.target.files&&ev.target.files[0];if(!f)return;if(f.size>2000000)return toast('JSON tối đa 2MB');var reader=new FileReader();reader.onload=function(){try{applyImport(JSON.parse(String(reader.result)))}catch(err){toast(err.message)}};reader.readAsText(f);ev.target.value=''});
document.getElementById('close').addEventListener('click',function(){document.getElementById('detail').close()});
load();
var collectionKeys=['economics','marketing','technology','policy','culture','lifestyle','employment'];
var requests=collectionKeys.map(function(k){return fetch('./data/'+k+'.json',{cache:'no-store'}).then(function(resp){if(!resp.ok)throw Error('Missing '+k);return resp.json()})});
requests.push(fetch('./data/insights.json',{cache:'no-store'}).then(function(resp){if(!resp.ok)throw Error('Missing insights');return resp.json()}));
Promise.all(requests).then(function(loaded){
 var stories=[];loaded.slice(0,7).forEach(function(part){if(!Array.isArray(part.stories)||part.stories.length!==10)throw Error('Expected 10 items per domain');stories=stories.concat(part.stories)});
 if(stories.length!==70)throw Error('Expected 70 stories; found '+stories.length);
 var insight=loaded[7];
 state.data=validateStories({stories:stories,links:insight.links||[],opportunities:insight.opportunities||[],updated_at:'2026-10-17'});
 state.isLive=true;render();
}).catch(function(err){
 fetch('./feed.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('No fallback');return r.json()}).then(function(x){state.data=validateStories(x);render();toast('Dữ liệu 70 tin chưa tải được, hiển thị bản xem trước')}).catch(function(){toast('Không tải được dữ liệu. Có thể nhập JSON thủ công');render()});
});
render();
})();
</script></body></html>
