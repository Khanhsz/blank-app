function renderObPv() {
  const pv = $('#obPv'); if (!pv) return;
  if (ob.err) { pv.innerHTML = `<div class="pv warn">${esc(ob.err)}</div>`; return; }
  if (!ob.staged) { pv.innerHTML = ''; return; }
  const ev = ob.staged.events;
  pv.innerHTML = ev.length ? `<div class="pv"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:12.5px">${ob.sample ? 'Lịch mẫu' : 'Tìm thấy'}: ${ev.length} sự kiện${ob.staged.label ? ' (' + ob.staged.label + ')' : ''}${ob.sample ? ' + 6 đầu việc chờ' : ''}</b><button type="button" class="mini" id="obClear">Xóa</button></div>${ev.slice(0, 5).map(e => `<div><span>${hm(e.start)}–${hm(e.end)}</span><span>${esc(e.title)}</span></div>`).join('')}${ev.length > 5 ? `<div><span></span><span>… và ${ev.length - 5} sự kiện khác</span></div>` : ''}</div>
    ${S.events.length ? `<label class="chk"><input type="checkbox" id="obRep" ${ob.replace ? 'checked' : ''}>Thay thế lịch cố định hiện có (${S.events.filter(e => e.kind === 'fixed').length} sự kiện)</label>` : ''}`
    : `<div class="pv">Không nhận diện được sự kiện nào. Hãy kiểm tra định dạng <b>08:00 - 09:45 Tên sự kiện</b>.</div>`;
}
async function obLoadFile(f) {
  ob.sample = false; ob.err = '';
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { ob.err = 'File quá lớn (tối đa 2 MB). Hãy xuất một khoảng thời gian ngắn hơn.'; ob.staged = null; renderObPv(); return; }
  try { ob.staged = parseICS(await f.text()); } catch (err) { ob.staged = null; ob.err = 'Không đọc được file này. Hãy thử xuất lại file .ics.'; }
  renderObPv();
}

// Đọc dữ liệu của bước hiện tại và kiểm tra hợp lệ. Trả về false nếu cần dừng.
function readObStep(validate) {
  const g = id => { const el = $(id); return el ? el.value : null; };
  if (ob.step === 1) {
    ob.d.name = (g('#obName') ?? ob.d.name).trim();
    ob.d.wake = readTime('obWake') || ob.d.wake; ob.d.sleep = readTime('obSleep') || ob.d.sleep;
    if (validate) {
      const w = pm(ob.d.wake), sl = pm(ob.d.sleep);
      if (w == null || sl == null) { toast('Hãy chọn giờ thức dậy và giờ đi ngủ'); return false; }
      if (w === sl) { toast('Giờ thức dậy và giờ đi ngủ không được trùng nhau'); return false; }
    }
  }
  if (ob.step === 2 && $('#mLn') !== null) {
    const m = ob.d.meals;
    m.breakfast = readTime('mBf') || ''; m.lunch = readTime('mLn') || ''; m.dinner = readTime('mDn') || '';
  }
  if (ob.step === 2 && validate && ob.d.meals.on) {
    const ts = ['breakfast', 'lunch', 'dinner'].map(k => pm(ob.d.meals[k])).filter(v => v != null);
    const w = pm(ob.d.wake), sl = pm(ob.d.sleep);
    const okOrder = ts.every((v, i) => i === 0 || v > ts[i - 1] + 59);
    const okRange = ts.every(v => v >= w && (sl <= w || v < sl));
    if (!ts.length) { toast('Hãy chọn ít nhất một bữa, hoặc tắt mục Bữa ăn'); ob.open = 'meals'; renderOb(); return false; }
    if (!okOrder) { toast('Các bữa ăn cần cách nhau ít nhất 1 giờ và theo thứ tự sáng → trưa → tối'); ob.open = 'meals'; renderOb(); return false; }
    if (!okRange) { toast('Giờ ăn cần nằm trong khoảng từ lúc thức dậy đến lúc đi ngủ'); ob.open = 'meals'; renderOb(); return false; }
  }
  return true;
}
function goStep(n, dir) {
  ob.dir = dir; ob.step = n; persistDraft(); renderOb(); $('#ob').scrollTop = 0;
}
function advanceOb() {
  if (!readObStep(true)) return;
  if (ob.step < OB_STEPS) goStep(ob.step + 1, 1); else finishOb();
}

$('#obIn').addEventListener('input', e => {
  if (e.target.closest('#obWake') || e.target.closest('#obSleep')) {
    ob.d.wake = readTime('obWake') || ob.d.wake; ob.d.sleep = readTime('obSleep') || ob.d.sleep;
    $('#obHint').innerHTML = sleepHint(ob.d);
  }
});
$('#obIn').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file' && e.target.type !== 'checkbox') { e.preventDefault(); advanceOb(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#ob').classList.contains('open') && S.profile.onboarded) closeOb(); });
$('#obIn').addEventListener('click', e => {
  const t = e.target;
  const set = t.closest('[data-set]');
  if (set) {
    const path = set.dataset.set.split('.'), raw = set.dataset.val, val = raw !== '' && !isNaN(raw) ? +raw : raw;
    if (path.length === 2) ob.d[path[0]][path[1]] = val; else ob.d[path[0]] = val;
    const seg = set.closest('.seg'); $$('button', seg).forEach(b => { b.classList.toggle('on', b === set); b.setAttribute('aria-pressed', b === set); }); placeGlider(seg);
    if (path[0] === 'sleepNeed') $('#obHint').innerHTML = sleepHint(ob.d);
    if (path.length === 2) { const sm = set.closest('.hbk')?.querySelector('.hbk-t small'); if (sm) sm.textContent = habitSummary(path[0], ob.d); }
    return;
  }
  const sw = t.closest('[data-sw]');
  if (sw) { readObStep(false); const k = sw.dataset.sw; ob.d[k].on = !ob.d[k].on; if (ob.d[k].on) ob.open = k; const y = $('#ob').scrollTop; renderOb(); $('#ob').scrollTop = y; return; }
  const op = t.closest('[data-open]');
  if (op) { readObStep(false); ob.open = ob.open === op.dataset.open ? '' : op.dataset.open; const y = $('#ob').scrollTop; renderOb(); $('#ob').scrollTop = y; return; }
  const pk = t.closest('[data-peak]'); if (pk) { ob.d.peak = pk.dataset.peak; $$('[data-peak]').forEach(b => { b.classList.toggle('on', b === pk); b.setAttribute('aria-checked', b === pk); }); return; }
  const gl = t.closest('[data-goal]'); if (gl) { ob.d.goal = gl.dataset.goal; $$('[data-goal]').forEach(b => { b.classList.toggle('on', b === gl); b.setAttribute('aria-checked', b === gl); }); return; }
  const gt = t.closest('[data-goto]'); if (gt) { if (readObStep(false)) goStep(+gt.dataset.goto, +gt.dataset.goto >= ob.step ? 1 : -1); return; }
  const sk = t.closest('[data-skip]');
  if (sk) {
    if (sk.dataset.skip === 'save') { if (readObStep(true)) { persistDraft(); finishOb(true); } }
    else if (sk.dataset.skip === 'next') goStep(ob.step + 1, 1);
    else { ob.staged = null; finishOb(); }
    return;
  }
  if (t.closest('#obClose')) { closeOb(); return; }
  if (t.closest('#obBack')) { readObStep(false); goStep(ob.step - 1, -1); return; }
  if (t.closest('#obClear')) { ob.staged = null; ob.sample = false; ob.err = ''; renderObPv(); return; }
  if (t.closest('#obParse')) { ob.sample = false; ob.err = ''; ob.staged = parseText($('#obTxt').value); renderObPv(); return; }
  if (t.closest('#obSample')) { ob.sample = true; ob.err = ''; ob.staged = { events: sampleData().events, label: '' }; renderObPv(); return; }
  if (t.closest('#obNext')) advanceOb();
});
$('#obIn').addEventListener('change', e => {
  if (e.target.id === 'obFile') obLoadFile(e.target.files[0]);
  if (e.target.id === 'obRep') ob.replace = e.target.checked;
});
$('#obIn').addEventListener('dragover', e => { const d = e.target.closest('#obDrop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
$('#obIn').addEventListener('dragleave', e => { const d = e.target.closest('#obDrop'); if (d) d.classList.remove('over'); });
$('#obIn').addEventListener('drop', e => { const d = e.target.closest('#obDrop'); if (d) { e.preventDefault(); d.classList.remove('over'); obLoadFile(e.dataTransfer.files[0]); } });

function finishOb(keepStaged) {
  snapshot();
  S.profile = { ...clone(ob.d), name: ob.d.name || '', onboarded: true };
  delete S.obStep; S.snz = {};
  if (ob.step === OB_STEPS || keepStaged) {
    if (ob.staged && ob.staged.events.length) {
      commitEvents(ob.staged.events, ob.replace);
      if (ob.sample && !S.tasks.length) sampleData().tasks.forEach(t => S.tasks.push({ id: uid(), ...t }));
    }
  }
  closeOb(); changed(); toast(ob.sample && ob.staged ? 'Aura đã sẵn sàng — đã nạp lịch mẫu' : 'Aura đã sẵn sàng đồng hành cùng bạn');
}

/* =====================================================================
   Global actions (event delegation)
   ===================================================================== */
function syncDrawer() { $('#drawer').classList.toggle('open', drawerOpen); $('#drawerBtn').setAttribute('aria-expanded', drawerOpen); }
function switchTab(t) {
  tab = t;
  $('#v-ai').classList.toggle('on', t === 'ai'); $('#v-cal').classList.toggle('on', t === 'cal');
  setActive($('#tabSeg'), 'data-tab', t);
  if (t === 'cal') {
    renderCal();
    const now = nowMin(), y = clamp(now, DAY0, DAY1) - DAY0 + $('#cal').getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.4;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  } else window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case 'toggleEv': { const ev = S.events.find(x => x.id === id); if (ev) { ev.done = !ev.done; changed(false); } break; }
    case 'insertGap': insertTask(a.dataset.task, +a.dataset.start); break;
    case 'addTask': openSheet('task'); break;
    case 'doneTask': { const t = S.tasks.find(x => x.id === id); if (t) { snapshot(); S.tasks = S.tasks.filter(x => x.id !== id); changed(); toast(`Hoàn thành “${t.title}”`, true); } break; }
    case 'delTask': { const t = S.tasks.find(x => x.id === id); if (t) { snapshot(); S.tasks = S.tasks.filter(x => x.id !== id); changed(); toast(`Đã xóa “${t.title}”`, true); } break; }
    case 'placeTask': placeBestGap(id); break;
    case 'closeSheet': closeSheet(); break;
    case 'cardGo': runCard((curCards || [])[0]); break;
    case 'cardSkip': skipCard(); break;
    case 'cardAlt': runAlt(curCards[0]); break;
    case 'logMeal': toggleMeal(a.dataset.key); break;
    case 'logEx': toggleEx(); break;
    case 'studyPlus': logStudy(15); break;
    case 'waterPlus': logWater(1); break;
    case 'waterMinus': logWater(-1); break;
    case 'insertMeal': { const m = MEALS.find(x => x[0] === a.dataset.key); addHabit(m[2], +a.dataset.start, +S.profile.meals.dur || 30, 'meal'); break; }
  }
});
$('#drawerBtn').addEventListener('click', () => { drawerOpen = !drawerOpen; syncDrawer(); });
$('#tabSeg').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) switchTab(b.dataset.tab); });
$('#pill').addEventListener('click', () => { rot = 0; renderAll(true); toast('Aura vừa quét lại ngữ cảnh của bạn'); });
$('#fab').addEventListener('click', () => openSheet(tab === 'cal' ? 'event' : 'task'));
$('#btnProfile').addEventListener('click', openOnboarding);

/* =====================================================================
   Swipe on proactive card (touch + mouse)
   ===================================================================== */
const sw = { el: null, x0: 0, y0: 0, dx: 0, lock: null };
function swStart(card, x, y) { sw.el = card; sw.x0 = x; sw.y0 = y; sw.dx = 0; sw.lock = null; }
function swMove(x, y, ev) {
  if (!sw.el) return;
  const dx = x - sw.x0, dy = y - sw.y0;
  if (!sw.lock) {
    if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
    sw.lock = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if (sw.lock === 'v') { sw.el = null; return; }
    sw.el.classList.add('dragging');
  }
  if (ev && ev.cancelable) ev.preventDefault();
  sw.dx = dx;
  sw.el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
  const p = clamp(Math.abs(dx) / 110, 0, 1);
  $('.hint-go', sw.el).style.opacity = dx > 0 ? p : 0;
  $('.hint-skip', sw.el).style.opacity = dx < 0 ? p : 0;
}
function swEnd() {
  const el = sw.el; if (!el) return; sw.el = null;
  if (sw.lock !== 'h') return;
  const dx = sw.dx, card = (curCards || [])[0];
  el.classList.remove('dragging');
  el.style.transition = 'transform .55s cubic-bezier(0.22,1,0.36,1), opacity .45s cubic-bezier(0.22,1,0.36,1)';
  if (Math.abs(dx) > 100) {
    const dir = dx > 0 ? 1 : -1;
    el.style.transform = `translateX(${dir * 130}%) rotate(${dir * 14}deg)`; el.style.opacity = 0;
    setTimeout(() => { if (dir > 0) runCard(card); else skipCard(); if (el.isConnected) { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; $$('.hint', el).forEach(h => h.style.opacity = 0); } }, 260);
  } else {
    el.style.transform = ''; $$('.hint', el).forEach(h => h.style.opacity = 0);
    setTimeout(() => { el.style.transition = ''; }, 600);
  }
}
const stackEl = $('#stack');
stackEl.addEventListener('touchstart', e => { const c = e.target.closest('.card.top'); if (c && !e.target.closest('button')) swStart(c, e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
stackEl.addEventListener('mousedown', e => { const c = e.target.closest('.card.top'); if (c && !e.target.closest('button') && e.button === 0) { swStart(c, e.clientX, e.clientY); e.preventDefault(); } });

/* =====================================================================
   Calendar drag & drop / resize
   ===================================================================== */
const drag = { active: false, pending: null, id: null, mode: null, y0: 0, lastY: 0, o: null, cur: null, el: null, raf: 0, timer: 0, suppress: 0 };
const calArea = $('#calArea');

function conflictOf(id, s, e) { return S.events.find(x => x.id !== id && x.start < e && x.end > s) || null; }
function beginDrag() {
  const p = drag.pending; if (!p) return;
  if (p.mode === 'create') return beginCreate(p);
  const ev = S.events.find(x => x.id === p.id); if (!ev) { drag.pending = null; return; }
  drag.active = true; drag.id = p.id; drag.mode = p.mode; drag.y0 = p.pageY0; drag.lastY = p.clientY;
  drag.o = { s: ev.start, e: ev.end }; drag.cur = { s: ev.start, e: ev.end };
  drag.el = calArea.querySelector(`.blk[data-id="${p.id}"]`);
  if (!drag.el) { drag.active = false; return; }
  drag.el.classList.add('dragging');
  const b = document.createElement('div'); b.className = 'badge'; drag.el.appendChild(b); drag.badge = b;
  document.body.classList.add('no-select');
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) { /* bỏ qua */ }
  updateDrag();
  cancelAnimationFrame(drag.raf); drag.raf = requestAnimationFrame(dragTick);
}
function beginCreate(p) {
  const top = calArea.getBoundingClientRect().top + window.scrollY;
  drag.active = true; drag.mode = 'create'; drag.id = null; drag.lastY = p.clientY; drag.areaTop = top;
  drag.anchor = clamp(DAY0 + Math.floor((p.pageY0 - top) / SNAP) * SNAP, DAY0, DAY1 - SNAP);
  drag.cur = { s: drag.anchor, e: drag.anchor + SNAP };
  const g = document.createElement('div'); g.className = 'blk ghost';
  g.innerHTML = '<div class="bd"><span class="t">(Sự kiện mới)</span></div>';
  const b = document.createElement('div'); b.className = 'badge'; g.appendChild(b);
  calArea.appendChild(g); drag.el = g; drag.badge = b;
  document.body.classList.add('no-select');
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) { /* bỏ qua */ }
  updateDrag();
  cancelAnimationFrame(drag.raf); drag.raf = requestAnimationFrame(dragTick);
}
function dragTick() {
  if (!drag.active) return;
  const vh = window.innerHeight;
  if (drag.lastY < 90) window.scrollBy(0, -11); else if (drag.lastY > vh - 120) window.scrollBy(0, 11);
  updateDrag();
  drag.raf = requestAnimationFrame(dragTick);
}
function updateDrag() {
  if (drag.mode === 'create') {
    const c = clamp(DAY0 + Math.floor((drag.lastY + window.scrollY - drag.areaTop) / SNAP) * SNAP, DAY0, DAY1 - SNAP);
    const s = Math.min(drag.anchor, c), e = Math.max(drag.anchor, c) + SNAP;
    drag.cur = { s, e };
    const el = drag.el, hit = conflictOf(null, s, e);
    el.style.top = (s - DAY0) + 'px'; el.style.height = (e - s - 1) + 'px';
    el.classList.toggle('conflict', !!hit); drag.badge.classList.toggle('warn', !!hit);
    drag.badge.textContent = `${hm(s)} – ${hm(e)} · ${fmtDur(e - s)}`;
    return;
  }
  const dy = drag.lastY + window.scrollY - drag.y0;
  const delta = Math.round(dy / SNAP) * SNAP, o = drag.o, len = o.e - o.s;
  let s, e;
  if (drag.mode === 'move') { s = clamp(o.s + delta, DAY0, DAY1 - len); e = s + len; }
  else { s = o.s; e = clamp(o.e + delta, o.s + SNAP, DAY1); }
  drag.cur = { s, e };
  const el = drag.el, c = conflictOf(drag.id, s, e);
  el.style.top = (s - DAY0) + 'px'; el.style.height = Math.max(e - s - 1, 18) + 'px';
  el.classList.toggle('conflict', !!c);
  drag.badge.classList.toggle('warn', !!c);
  drag.badge.textContent = `${hm(s)} – ${hm(e)} · ${fmtDur(e - s)}${c ? ' · Trùng “' + c.title + '”' : ''}`;
  const m = $('.m', el); if (m) m.textContent = `${hm(s)}–${hm(e)}`;
}
function endDrag(commit) {
  clearTimeout(drag.timer); drag.timer = 0;
  const was = drag.active;
  if (was && drag.mode === 'create') {
    cancelAnimationFrame(drag.raf);
    const c = drag.cur;
    drag.active = false; document.body.classList.remove('no-select'); drag.suppress = Date.now();
    if (drag.el) drag.el.remove();
    drag.el = null; drag.mode = null;
    if (commit) openSheet('event', { start: c.s, end: c.e });
  } else if (was) {
    cancelAnimationFrame(drag.raf);
    const ev = S.events.find(x => x.id === drag.id), c = drag.cur;
    drag.active = false; document.body.classList.remove('no-select'); drag.suppress = Date.now();
    if (drag.badge) drag.badge.remove();
    if (drag.el) drag.el.classList.remove('dragging', 'conflict');
    if (commit && ev && (c.s !== ev.start || c.e !== ev.end)) {
      const clash = conflictOf(ev.id, c.s, c.e);
      snapshot(); ev.start = c.s; ev.end = c.e; changed();
      toast(clash ? `Đã đổi sang ${hm(c.s)}–${hm(c.e)} · trùng với “${clash.title}”` : `Đã đổi sang ${hm(c.s)}–${hm(c.e)}`, true);
    } else changed(false);
  }
  drag.pending = null;
}
function pressStart(e, touch) {
  const t = e.target;
  if (t.closest('.x')) return;
  const blk = t.closest('.blk');
  const pt = touch ? e.touches[0] : e;
  if (!blk) {
    drag.pending = { id: null, mode: 'create', x0: pt.clientX, y0: pt.clientY, pageY0: pt.clientY + window.scrollY, clientY: pt.clientY, touch };
    if (touch) drag.timer = setTimeout(beginDrag, 280);
    return;
  }
  const grip = !!t.closest('[data-grip]');
  drag.pending = { id: blk.dataset.id, mode: grip ? 'resize' : 'move', x0: pt.clientX, y0: pt.clientY, pageY0: pt.clientY + window.scrollY, clientY: pt.clientY, touch };
  if (touch) {
    if (grip) { e.preventDefault(); beginDrag(); }
    else drag.timer = setTimeout(beginDrag, 280);
  } else if (grip) { e.preventDefault(); beginDrag(); }
}
calArea.addEventListener('touchstart', e => pressStart(e, true), { passive: false });
calArea.addEventListener('mousedown', e => { if (e.button === 0 && !e.target.closest('.x')) pressStart(e, false); });
calArea.addEventListener('contextmenu', e => { if (e.target.closest('.blk')) e.preventDefault(); });

function moveGeneric(x, y, e) {
  if (drag.active) { drag.lastY = y; if (e.cancelable) e.preventDefault(); return; }
  const p = drag.pending; if (!p) return;
  const moved = Math.hypot(x - p.x0, y - p.y0);
  if (p.touch) { if (moved > 8) { clearTimeout(drag.timer); drag.timer = 0; drag.pending = null; } }   // người dùng đang cuộn trang
  else if (moved > 4) { p.clientY = y; beginDrag(); }
}
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  if (sw.el) swMove(t.clientX, t.clientY, e);
  moveGeneric(t.clientX, t.clientY, e);
}, { passive: false });
document.addEventListener('mousemove', e => { if (sw.el) swMove(e.clientX, e.clientY, e); moveGeneric(e.clientX, e.clientY, e); });
function releaseAll(e, commit = true) {
  if (drag.active && e && e.cancelable && e.type === 'touchend') e.preventDefault();
  endDrag(commit); swEnd();
}
document.addEventListener('touchend', e => releaseAll(e));
document.addEventListener('touchcancel', e => releaseAll(e, false));
document.addEventListener('mouseup', e => releaseAll(e));

// Chạm vào khối → sửa, chạm vào khoảng trống → tạo mới, ✕ → xóa
calArea.addEventListener('click', e => {
  if (Date.now() - drag.suppress < 400) return;
  const x = e.target.closest('.x');
  if (x) { deleteEvent(x.dataset.id); return; }
  const blk = e.target.closest('.blk');
  if (blk) { openSheet('event', { edit: blk.dataset.id }); return; }
  const r = calArea.getBoundingClientRect();
  const m = clamp(DAY0 + Math.floor((e.clientY - r.top) / SNAP) * SNAP, DAY0, DAY1 - SNAP);
  openSheet('event', { start: m, end: Math.min(m + 60, DAY1) });
});

/* =====================================================================
   Boot
   ===================================================================== */
load();
renderAll(false);
syncDrawer();
if (!S.profile.onboarded) openOnboarding();
window.addEventListener('resize', placeGliders);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeGliders);
requestAnimationFrame(() => { placeGliders(); setTimeout(() => runShimmer(), 250); });

// Nhịp thời gian thực: cập nhật khi đang dùng giờ thật
let lastReal = realNow();
setInterval(() => {
  if (drag.active || sh.open || sw.el) return;
  const n = realNow();
  if (sim == null && n !== lastReal) {
    lastReal = n;
    const before = stackSig;
    renderAll(false);
    if (stackSig !== before) runShimmer();
  } else if (sim == null) renderPill();
}, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && sim == null && !drag.active) renderAll(true); });
})();
</script>
